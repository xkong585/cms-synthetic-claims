name: Reproduce synthetic CMS claims
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: bash run_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-aggregate-evidence
          path: |
            reports/
            evidence/
